server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/javascript application/json text/css image/svg+xml;
    gzip_min_length 1024;

    # Embedded DNS Dockera. Razem z `proxy_pass` przez zmienną sprawia, że nginx
    # NIE rozwiązuje upstreamu przy starcie — backend Phoenix jest opcjonalny,
    # a gra jest offline-first, więc jego brak nie może wywalić serwera statyków.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Assety mają hash w nazwie — mogą być immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Klient i API pod jedną domeną — również w produkcji nie ma CORS-u.
    location /api/ {
        set $ms_backend "server:4000";
        proxy_pass http://$ms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_intercept_errors off;
    }

    location /socket/ {
        set $ms_socket "server:4000";
        proxy_pass http://$ms_socket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
